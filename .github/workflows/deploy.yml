name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_keycloak:
        description: "Also rebuild and roll out Keycloak"
        type: boolean
        default: false
      rollback_tag:
        description: "Roll back: re-deploy this existing image tag (skips checks, build and migrations)"
        type: string
        default: ""

# Never let two deploys race for the same service.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  # Required to fetch the OIDC token that assumes the AWS deploy role.
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'match-maker-prod-cluster' }}
  ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'match-maker-prod-web' }}
  ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE || 'match-maker-prod-worker' }}
  ECS_KEYCLOAK_SERVICE: ${{ vars.ECS_KEYCLOAK_SERVICE || 'match-maker-prod-keycloak' }}
  MIGRATE_TASK_FAMILY: ${{ vars.MIGRATE_TASK_FAMILY || 'match-maker-prod-migrate' }}

jobs:
  # Decides what ships: the pushed commit, or an existing tag on rollback.
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      rollback: ${{ steps.plan.outputs.rollback }}
    steps:
      - id: plan
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          set -euo pipefail
          if [ -n "${ROLLBACK_TAG:-}" ]; then
            if ! [[ "$ROLLBACK_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::rollback_tag must be an image tag (a commit SHA prefix), got '$ROLLBACK_TAG'."
              exit 1
            fi
            echo "tag=$ROLLBACK_TAG" >> "$GITHUB_OUTPUT"
            echo "rollback=true" >> "$GITHUB_OUTPUT"
            echo "Rolling back to $ROLLBACK_TAG"
          else
            # The commit SHA is the tag. `latest` also moves, but every deploy is
            # pinned to an immutable tag so a rollback is just a re-deploy of one.
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "rollback=false" >> "$GITHUB_OUTPUT"
          fi

  # The full CI suite (lint, typecheck, unit + real-Postgres integration tests,
  # Terraform validate) against the exact commit being shipped. Nothing is
  # built or pushed unless all of it passes.
  ci:
    name: Required checks
    needs: [plan]
    if: needs.plan.outputs.rollback != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      build_images: false

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [plan, ci]
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: APP_VERSION=${{ env.TAG }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/match-maker-prod/web:${{ env.TAG }}
            ${{ steps.ecr.outputs.registry }}/match-maker-prod/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/migrate.Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/match-maker-prod/migrate:${{ env.TAG }}
            ${{ steps.ecr.outputs.registry }}/match-maker-prod/migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          build-args: APP_VERSION=${{ env.TAG }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/match-maker-prod/worker:${{ env.TAG }}
            ${{ steps.ecr.outputs.registry }}/match-maker-prod/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Keycloak
        if: inputs.deploy_keycloak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/keycloak.Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/match-maker-prod/keycloak:${{ env.TAG }}
            ${{ steps.ecr.outputs.registry }}/match-maker-prod/keycloak:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    needs: [plan, build-and-push]
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Running the family name would start its newest revision, which points
      # at the mutable `latest` tag. Register a revision pinned to this release
      # so exactly the migrator that was just built runs.
      - name: Pin migrate task definition to the new image
        id: migrate-taskdef
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecs describe-task-definition --task-definition "$MIGRATE_TASK_FAMILY" \
            --query 'taskDefinition' > migrate-taskdef.json
          jq --arg IMAGE "$REGISTRY/match-maker-prod/migrate:$TAG" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' migrate-taskdef.json > new-migrate-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-migrate-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $NEW_ARN"

      # Migrations run BEFORE the new tasks roll out, so they must be
      # backwards-compatible with the version currently serving traffic.
      - name: Run migration task and wait
        run: |
          set -euo pipefail

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "${{ steps.migrate-taskdef.outputs.arn }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.TASK_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "Exit code: $EXIT_CODE ($REASON)"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration failed — aborting deploy. Check /ecs/match-maker-prod/migrate."
            exit 1
          fi

  deploy:
    name: Roll out
    runs-on: ubuntu-latest
    needs: [plan, build-and-push, migrate]
    # A rollback skips checks, build and migrations (the schema only moves
    # forward); a normal release needs all of them to have succeeded.
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.rollback == 'true' || needs.migrate.result == 'success')
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the rollback images exist
        if: needs.plan.outputs.rollback == 'true'
        run: |
          set -euo pipefail
          repos="web worker"
          if [ "${{ inputs.deploy_keycloak }}" = "true" ]; then repos="$repos keycloak"; fi
          for repo in $repos; do
            aws ecr describe-images --repository-name "match-maker-prod/$repo" \
              --image-ids imageTag="$TAG" >/dev/null \
              || { echo "::error::No $repo image tagged $TAG in ECR."; exit 1; }
          done

      # Remembered so a failed smoke test can put these back.
      - name: Record the revisions currently serving
        id: previous
        run: |
          set -euo pipefail
          for svc in web worker; do
            name_var="ECS_${svc^^}_SERVICE"
            arn=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "${!name_var}" \
              --query 'services[0].taskDefinition' --output text)
            echo "$svc=$arn" >> "$GITHUB_OUTPUT"
            echo "$svc is serving $arn"
          done

      - name: Pin web task definition to the new image
        id: taskdef
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecs describe-task-definition \
            --task-definition "$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_WEB_SERVICE" --query 'services[0].taskDefinition' --output text)" \
            --query 'taskDefinition' > taskdef.json

          # Strip the server-managed fields that RegisterTaskDefinition rejects,
          # then point the container at the immutable tag.
          jq --arg IMAGE "$REGISTRY/match-maker-prod/web:$TAG" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' taskdef.json > new-taskdef.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $NEW_ARN"

      - name: Update web service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WEB_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --query 'service.deployments[0].id' --output text

      - name: Pin worker task definition to the new image
        id: worker-taskdef
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecs describe-task-definition \
            --task-definition "$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_WORKER_SERVICE" --query 'services[0].taskDefinition' --output text)" \
            --query 'taskDefinition' > worker-taskdef.json

          jq --arg IMAGE "$REGISTRY/match-maker-prod/worker:$TAG" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' worker-taskdef.json > new-worker-taskdef.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-worker-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $NEW_ARN"

      - name: Update worker service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --task-definition "${{ steps.worker-taskdef.outputs.arn }}" \
            --query 'service.deployments[0].id' --output text

      # Forcing a new deployment would restart Keycloak's current revision,
      # which points at `latest`; pin it to the tag that was just built.
      - name: Pin and roll out Keycloak
        if: inputs.deploy_keycloak
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecs describe-task-definition \
            --task-definition "$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_KEYCLOAK_SERVICE" --query 'services[0].taskDefinition' --output text)" \
            --query 'taskDefinition' > keycloak-taskdef.json
          jq --arg IMAGE "$REGISTRY/match-maker-prod/keycloak:$TAG" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' keycloak-taskdef.json > new-keycloak-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-keycloak-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_KEYCLOAK_SERVICE" \
            --task-definition "$NEW_ARN" >/dev/null
          echo "Keycloak rolling out $NEW_ARN"

      - name: Wait for the service to stabilise
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_WEB_SERVICE" "$ECS_WORKER_SERVICE"
          echo "Web and worker deployments are stable."

      # The deployment circuit breaker rolls a failed rollout back, after which
      # the service is "stable" on the OLD revision. Check what is serving.
      - name: Confirm the new revisions are serving
        run: |
          set -euo pipefail
          check() {
            local service=$1 expected=$2 serving
            serving=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" \
              --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)
            if [ "$serving" != "$expected" ]; then
              echo "::error::$service is serving $serving, not $expected (ECS rolled the deployment back)."
              return 1
            fi
            echo "$service is serving $expected"
          }
          check "$ECS_WEB_SERVICE" "${{ steps.taskdef.outputs.arn }}"
          check "$ECS_WORKER_SERVICE" "${{ steps.worker-taskdef.outputs.arn }}"

      - name: Smoke test
        env:
          URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ]; then
            echo "::error::Set the APP_BASE_URL repository variable; a release is not verified without a smoke test."
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            version=$(curl -fsS --max-time 15 "$URL/api/health" | jq -r '.version' || true)
            if [ "$version" = "$TAG" ] && curl -fsS --max-time 15 "$URL/api/health/ready" | tee /tmp/ready.json; then
              echo
              echo "$URL is serving $TAG and its dependencies are ready."
              exit 0
            fi
            echo "attempt $attempt: serving '${version:-nothing}', expected '$TAG'; retrying in 10s"
            sleep 10
          done

          echo "::error::Smoke test failed for $TAG."
          exit 1

      - name: Roll back to the previous revisions
        if: failure() && steps.previous.outputs.web != ''
        run: |
          set -euo pipefail
          echo "::warning::Deploy of $TAG failed; restoring the revisions that were serving before."
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_WEB_SERVICE" \
            --task-definition "${{ steps.previous.outputs.web }}" >/dev/null
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_WORKER_SERVICE" \
            --task-definition "${{ steps.previous.outputs.worker }}" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_WEB_SERVICE" "$ECS_WORKER_SERVICE"
          echo "Restored ${{ steps.previous.outputs.web }} and ${{ steps.previous.outputs.worker }}."
